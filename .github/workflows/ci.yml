name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Instalar dependências
        run: pip install -r tools/requirements.txt

      - name: Executar testes
        run: pytest tools/tests -q

      # As seções 8.2 e 8.3 do Registro de Prompts aguardam execuções reais
      # em assistentes de IA. Até lá o validador pode reportar falhas, então
      # este passo não bloqueia o CI.
      - name: Validar artefatos
        run: python tools/validar_artefatos.py
        continue-on-error: true
